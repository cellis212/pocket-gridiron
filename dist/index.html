<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Gridiron</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Graduate&display=swap">
<style>
/* Layout: a broadcast desk. Sticky scoreboard-style top bar, then a two-column work area
   (controls on the left, the game on the right) that stacks into one column on phones. */
:root {
  --bg: #f2f4ee;
  --surface: #ffffff;
  --surface-2: #e9ede4;
  --ink: #15211a;
  --ink-2: #48584e;
  --ink-3: #6f7f74;
  --line: #d4dbcf;
  --turf: #2d7a4b;
  --turf-2: #276d42;
  --chalk: #f7f9f4;
  --flag: #f2c230;
  --flag-ink: #2a2100;
  --home: #c62d2d;
  --away: #2a63c4;
  --good: #2b7d47;
  --bad: #b8382c;
  --bar: #3d6b52;
  --bar-track: #e3e9df;
  --shadow: 0 1px 2px rgb(21 33 26 / 0.08), 0 4px 16px rgb(21 33 26 / 0.06);
  --font-display: 'Graduate', 'Rockwell', 'Georgia', serif;
  --font-head: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --font-body: 'Barlow', 'Helvetica Neue', 'Segoe UI', sans-serif;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1612; --surface: #16221b; --surface-2: #1d2b23; --ink: #e6ede8; --ink-2: #a9b8ae; --ink-3: #82958a;
    --line: #2b3b32; --turf: #1f5c39; --turf-2: #1b5333; --chalk: #e9efe9; --flag: #f2c230; --flag-ink: #2a2100;
    --home: #e2554f; --away: #5b8de0; --good: #5cbf7c; --bad: #ec6a5c; --bar: #7fb895; --bar-track: #23342a;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 4px 16px rgb(0 0 0 / 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1612; --surface: #16221b; --surface-2: #1d2b23; --ink: #e6ede8; --ink-2: #a9b8ae; --ink-3: #82958a;
  --line: #2b3b32; --turf: #1f5c39; --turf-2: #1b5333; --chalk: #e9efe9; --flag: #f2c230; --flag-ink: #2a2100;
  --home: #e2554f; --away: #5b8de0; --good: #5cbf7c; --bad: #ec6a5c; --bar: #7fb895; --bar-track: #23342a;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 4px 16px rgb(0 0 0 / 0.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.45 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--flag); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--turf); color: var(--chalk);
  border-bottom: 3px solid var(--flag);
}
.topbar-inner {
  max-width: 1240px; margin: 0 auto; padding: 10px 16px;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.wordmark { font-family: var(--font-display); font-size: 21px; letter-spacing: 0.04em; line-height: 1; white-space: nowrap; }
.wordmark small { display: block; font: 600 11px/1.2 var(--font-head); letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.8; margin-top: 3px; }
.nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.nav button {
  background: transparent; border: 0; color: var(--chalk); cursor: pointer;
  font: 600 15px/1 var(--font-head); letter-spacing: 0.08em; text-transform: uppercase;
  padding: 9px 12px; border-radius: 4px; opacity: 0.85;
}
.nav button:hover { opacity: 1; background: rgb(255 255 255 / 0.08); }
.nav button[aria-current="page"] { opacity: 1; background: var(--flag); color: var(--flag-ink); }

main { max-width: 1240px; margin: 0 auto; padding: 18px 16px 48px; }

/* ---------- shared pieces ---------- */
h1, h2, h3 { font-family: var(--font-head); font-weight: 700; letter-spacing: 0.01em; text-wrap: balance; margin: 0; }
h1 { font-size: 30px; line-height: 1.1; }
h2 { font-size: 22px; line-height: 1.15; }
h3 { font-size: 17px; line-height: 1.2; }
.eyebrow { font: 600 12px/1.2 var(--font-head); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
.panel.flush { padding: 0; overflow: hidden; }
.panel-head { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.layout { display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: 16px; align-items: start; }
.ctl-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 900px) {
  .layout, .grid-2 { grid-template-columns: minmax(0, 1fr) !important; }
  .layout.ex > section { order: -1; }
  .sticky-card { position: static !important; }
}

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font: 600 14px/1 var(--font-head); letter-spacing: 0.06em; text-transform: uppercase;
  padding: 10px 14px; border-radius: 4px; cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--flag); border-color: var(--flag); color: var(--flag-ink); }
.btn.primary:hover { filter: brightness(0.96); }
.btn.big { font-size: 17px; padding: 13px 20px; }
.btn.ghost { background: transparent; }
.btn.small { font-size: 12px; padding: 6px 9px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.danger { color: var(--bad); }

.field { display: flex; flex-direction: column; gap: 4px; font: 600 12px/1.2 var(--font-head); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); min-width: 0; }
select, input[type="text"], input[type="search"], input[type="number"], textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; min-width: 0;
  font: 500 15px/1.2 var(--font-body); letter-spacing: 0; text-transform: none; color: var(--ink);
}
input[type="range"] { accent-color: var(--turf); width: 100%; }
textarea { width: 100%; min-height: 90px; font: 12px/1.4 ui-monospace, Menlo, monospace; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button {
  border: 0; background: none; cursor: pointer; padding: 10px 12px; white-space: nowrap;
  font: 600 14px/1 var(--font-head); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3);
  border-bottom: 3px solid transparent; margin-bottom: -1px;
}
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--flag); }

.chip { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 3px; font: 700 10.5px/1 var(--font-head); letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }
.chips { display: inline-flex; gap: 3px; vertical-align: middle; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); font: 600 12px/1.4 var(--font-head); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; }
.pill.warn { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
.pill.good { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.pill.flag { background: var(--flag); color: var(--flag-ink); }

/* Jersey badge: the player's number on a two-tone jersey in his type colors. */
.jersey {
  flex: none; width: 34px; height: 34px; border-radius: 7px 7px 10px 10px; display: grid; place-items: center;
  font: 15px/1 var(--font-display); color: #fff; text-shadow: 0 1px 0 rgb(0 0 0 / 0.35);
  background: linear-gradient(135deg, var(--j1) 0 55%, var(--j2) 55% 100%);
  box-shadow: inset 0 0 0 2px rgb(255 255 255 / 0.25);
}
.jersey.sm { width: 26px; height: 26px; font-size: 12px; border-radius: 5px 5px 8px 8px; }
.jersey.lg { width: 64px; height: 64px; font-size: 28px; border-radius: 12px 12px 18px 18px; }
.who { display: flex; align-items: center; gap: 8px; min-width: 0; }
.who-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who-sub { font-size: 12px; color: var(--ink-3); white-space: nowrap; }

.ovr { display: inline-grid; place-items: center; min-width: 32px; height: 24px; padding: 0 5px; border-radius: 4px; font: 700 14px/1 var(--font-body); font-variant-numeric: tabular-nums; background: var(--surface-2); color: var(--ink); }
.ovr.t1 { background: #1d6b3e; color: #fff; }
.ovr.t2 { background: #4f8a3a; color: #fff; }
.ovr.t3 { background: #b38f1d; color: #fff; }
.ovr.t4 { background: #a4572a; color: #fff; }
.ovr.t5 { background: #8f3b33; color: #fff; }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
table.data th { font: 600 12px/1.2 var(--font-head); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); text-align: right; padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; background: var(--surface); }
table.data td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.data th.l, table.data td.l { text-align: left; }
table.data tbody tr:hover { background: var(--surface-2); }
table.data tr.sel { background: color-mix(in srgb, var(--flag) 22%, transparent); }
table.data tr.me td:first-child { box-shadow: inset 3px 0 0 var(--flag); }
table.data th button { all: unset; cursor: pointer; }
table.data th button:hover, table.data th button[aria-pressed="true"] { color: var(--ink); }
tr.clickable { cursor: pointer; }

/* ---------- scoreboard ---------- */
.scoreboard { background: var(--ink); color: var(--bg); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 10px; }
:root[data-theme="dark"] .scoreboard { background: #050a07; color: var(--ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .scoreboard { background: #050a07; color: var(--ink); } }
.sb-row { display: grid; grid-template-columns: 10px minmax(0, 1fr) repeat(var(--qs, 4), 30px) 56px; align-items: center; gap: 8px; }
.sb-row .team { font: 700 18px/1.1 var(--font-head); letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-row .q { text-align: center; font: 500 14px/1 var(--font-body); font-variant-numeric: tabular-nums; opacity: 0.75; }
.sb-row .t { text-align: right; font: 30px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.sb-row.lose .t, .sb-row.lose .team { opacity: 0.6; }
.sb-head .q, .sb-head .t { font: 600 11px/1 var(--font-head); letter-spacing: 0.12em; opacity: 0.6; }
.sb-dot { width: 10px; height: 26px; border-radius: 2px; }
.sb-meta { display: flex; gap: 14px; flex-wrap: wrap; font: 600 12px/1.2 var(--font-head); letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.75; }

/* ---------- field ---------- */
.field-wrap { border-radius: var(--radius); overflow: hidden; background: var(--turf); }
.field-wrap svg { display: block; width: 100%; height: auto; }
.ball { transition: transform 0.45s ease; }

/* ---------- play-by-play ---------- */
.plays { max-height: 560px; overflow-y: auto; }
.play { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
.play:hover { background: var(--surface-2); }
.play.cur { background: color-mix(in srgb, var(--flag) 20%, transparent); }
.play .when { font: 600 12px/1.3 var(--font-head); letter-spacing: 0.06em; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.play .sit { font: 600 11px/1.3 var(--font-head); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.play .txt { min-width: 0; }
.play.score .txt { font-weight: 700; }
.play.note { cursor: default; background: var(--surface-2); }
.play.note .txt { font: 600 13px/1.3 var(--font-head); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
.tm-tag { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 1px; }

/* ---------- bars (ratings) ---------- */
.bars { display: grid; gap: 6px; }
.bar-row { display: grid; grid-template-columns: 108px minmax(0, 1fr) 30px; gap: 8px; align-items: center; font-size: 13px; }
.bar-row .lbl { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-row .val { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.bar-track { height: 8px; background: var(--bar-track); border-radius: 0 4px 4px 0; overflow: hidden; }
.bar-fill { height: 100%; background: var(--bar); border-radius: 0 4px 4px 0; }
.bar-fill.hot { background: var(--flag); }

/* ---------- stat tiles ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.tile { background: var(--surface-2); border-radius: var(--radius); padding: 10px 12px; min-width: 0; }
.tile .k { font: 600 12px/1.2 var(--font-head); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.tile .v { font: 600 26px/1.15 var(--font-body); }
.tile .s { font-size: 12px; color: var(--ink-2); }

/* ---------- team cards (exhibition) ---------- */
.teamcard { border-top: 4px solid var(--tc); }
.slot-list { display: grid; gap: 2px; }
.slot { display: grid; grid-template-columns: 40px minmax(0, 1fr) 36px; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 4px; cursor: pointer; border: 0; background: none; text-align: left; width: 100%; }
.slot:hover { background: var(--surface-2); }
.slot.cur { background: color-mix(in srgb, var(--flag) 22%, transparent); }
.slot .pos { font: 700 12px/1 var(--font-head); letter-spacing: 0.08em; color: var(--ink-3); }
.group-label { font: 600 11px/1 var(--font-head); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); padding: 10px 6px 4px; }

.picker { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.picker-list { max-height: 300px; overflow-y: auto; }
.picker-item { display: grid; grid-template-columns: minmax(0, 1fr) 40px; gap: 8px; align-items: center; padding: 5px 10px; width: 100%; border: 0; background: none; text-align: left; cursor: pointer; border-bottom: 1px solid var(--line); }
.picker-item:hover { background: var(--surface-2); }

/* ---------- player card ---------- */
.card-head { display: flex; gap: 14px; align-items: center; }
.card-head .big-ovr { margin-left: auto; text-align: center; }
.card-head .big-ovr .v { font: 700 34px/1 var(--font-body); }
.card-section { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
.statgrid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; text-align: center; }
.statgrid .k { font: 600 11px/1.2 var(--font-head); letter-spacing: 0.1em; color: var(--ink-3); }
.statgrid .v { font-weight: 600; font-variant-numeric: tabular-nums; }
.evo { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.evo .arrow { color: var(--ink-3); font-size: 12px; }

/* ---------- news ---------- */
.news { display: grid; }
.news-item { padding: 8px 14px; border-bottom: 1px solid var(--line); font-size: 14px; display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 10px; }
.news-item .when { font: 600 11px/1.5 var(--font-head); letter-spacing: 0.08em; color: var(--ink-3); text-transform: uppercase; }
.news-item.user { background: color-mix(in srgb, var(--flag) 12%, transparent); }
.news-item.evolve .txt::before { content: '↑ '; color: var(--good); font-weight: 700; }

/* ---------- histogram ---------- */
.hist svg { display: block; width: 100%; height: auto; overflow: visible; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.tip { position: fixed; pointer-events: none; z-index: 50; background: var(--ink); color: var(--bg); font-size: 12px; padding: 6px 8px; border-radius: 4px; white-space: nowrap; }

/* ---------- modal ---------- */
.modal-back { position: fixed; inset: 0; background: rgb(5 10 7 / 0.55); z-index: 40; display: grid; place-items: start center; padding: 24px 12px; overflow-y: auto; }
.modal { width: min(980px, 100%); background: var(--bg); border-radius: 8px; box-shadow: var(--shadow); padding: 16px; display: grid; gap: 14px; }

.empty { padding: 28px 16px; text-align: center; color: var(--ink-2); }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 6px; z-index: 60; font-weight: 600; box-shadow: var(--shadow); }
.footer { max-width: 1240px; margin: 0 auto; padding: 0 16px 32px; font-size: 12px; color: var(--ink-3); }
.hide-sm { }
@media (max-width: 600px) {
  .hide-sm { display: none; }
  .wordmark { font-size: 18px; }
  .sb-row { grid-template-columns: 8px minmax(0, 1fr) repeat(var(--qs, 4), 22px) 44px; gap: 6px; }
  .sb-row .t { font-size: 24px; }
  .bar-row { grid-template-columns: 92px minmax(0, 1fr) 28px; }
  .statgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

</style>
</head>
<body>
<div id="app"></div>
<script type="module">
// ---- ui/state.js
// App state, rendering hook, saves and toasts.

const S = {
  tab: 'exhibition',
  ex: {
    home: { theme: 'gen1', level: 100, overrides: {}, style: 'balanced', aggr: 'normal' },
    away: { theme: 'gen9', level: 100, overrides: {}, style: 'balanced', aggr: 'normal' },
    result: null, view: 'plays', cur: null, watchI: null, multi: null, editing: null, pickQ: '', open: { home: false, away: false },
  },
  scout: { q: '', type: 'all', gen: 'all', pos: 'best', level: 100, legend: 'all', sort: 'ovr', dir: -1, page: 0, sel: 445 },
  lg: null,
  lgTab: 'home',
  lgUi: { draftPos: 'all', draftQ: '', faPos: 'all', faQ: '', confirmDelete: false, saveCode: '', loadCode: '' },
  modal: null,
  toast: null,
};

let renderFn = () => {};
function setRenderer(fn) { renderFn = fn; }
function rerender() { renderFn(); }

let toastTimer = null;
function toast(msg) {
  S.toast = msg;
  rerender();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { S.toast = null; rerender(); }, 2800);
}

const LEAGUE_KEY = 'pocket-gridiron:league:v1';
const UI_KEY = 'pocket-gridiron:ui:v1';

function saveLeague() {
  try {
    if (S.lg) localStorage.setItem(LEAGUE_KEY, JSON.stringify(S.lg));
    else localStorage.removeItem(LEAGUE_KEY);
    return true;
  } catch {
    return false;
  }
}
function loadLeague() {
  try {
    const raw = localStorage.getItem(LEAGUE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch {
    return null;
  }
}
function saveUi() {
  try {
    localStorage.setItem(UI_KEY, JSON.stringify({ tab: S.tab, lgTab: S.lgTab, home: S.ex.home, away: S.ex.away }));
  } catch { /* storage is optional */ }
}
function loadUi() {
  try {
    const raw = localStorage.getItem(UI_KEY);
    if (!raw) return;
    const u = JSON.parse(raw);
    if (u.tab) S.tab = u.tab;
    if (u.lgTab) S.lgTab = u.lgTab;
    if (u.home) S.ex.home = { ...S.ex.home, ...u.home };
    if (u.away) S.ex.away = { ...S.ex.away, ...u.away };
  } catch { /* storage is optional */ }
}

// ---- data/pokedex.js
// Generated by scripts/build-data.mjs from PokeAPI data (commit c8075719). Do not edit.
// Fields: id, name, slug, genus, gen, types (indexes into TYPES), base [hp, atk, def, spa, spd, spe],
// h (decimetres), w (hectograms), shape, growth, leg, myth, baby, from (pre-evolution id), evoLvl,
// abil (regular abilities), hidden (hidden ability).

// ---- engine/rng.js
// Seeded random numbers. Every game and league uses one of these, so a seed replays exactly.

function makeRng(seed) {
  let state = (Number(seed) >>> 0) || 0x9e3779b9;
  const rng = {
    get state() { return state; },
    set state(v) { state = v >>> 0; },
    next() {
      state = (state + 0x6d2b79f5) >>> 0;
      let x = state;
      x = Math.imul(x ^ (x >>> 15), x | 1);
      x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
      return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
    },
    int(lo, hi) { return lo + Math.floor(rng.next() * (hi - lo + 1)); },
    chance(p) { return rng.next() < p; },
    pick(arr) { return arr[Math.floor(rng.next() * arr.length)]; },
    normal(mean = 0, sd = 1) {
      const u = Math.max(rng.next(), 1e-12);
      const v = rng.next();
      return mean + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    },
    exp(mean) { return -mean * Math.log(Math.max(rng.next(), 1e-12)); },
    weighted(items, weightOf) {
      let total = 0;
      for (const it of items) total += Math.max(0, weightOf(it));
      if (total <= 0) return items[Math.floor(rng.next() * items.length)];
      let r = rng.next() * total;
      for (const it of items) {
        r -= Math.max(0, weightOf(it));
        if (r <= 0) return it;
      }
      return items[items.length - 1];
    },
    shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(rng.next() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    },
  };
  return rng;
}

function randomSeed() {
  return Math.floor(Math.random() * 4294967296) >>> 0;
}

// How well each body shape can hold a ball (hands) and kick one (legs).
const SHAPE_HANDS = {

  'bug-wings': 'Insect', heads: 'Many heads', blob: 'Blob', wings: 'Winged', legs: 'Legs only',

// Abilities that change a stat or a rating before the game starts. Game-time abilities live in perks.js.
const STAT_ABILITIES = {
  'huge-power': { atk: 2 },
  'pure-power': { atk: 2 },
  'gorilla-tactics': { atk: 1.5 },
  hustle: { atk: 1.5 },
  'fur-coat': { def: 2 },
};
const RATING_ABILITIES = {
  hustle: { THA: 0.8, CTH: 0.8, KAC: 0.8 },
  'compound-eyes': { THA: 1.2, CTH: 1.2, KAC: 1.2 },
  'keen-eye': { COV: 1.06, CTH: 1.06 },
  'no-guard': { THA: 1.1, CTH: 1.1 },
};

function abilityOf(speciesId, slot) {
  const sp = DEX.get(speciesId);
  if (slot === 2) return sp.hidden || sp.abil[0] || '';
  return sp.abil[slot] || sp.abil[0] || sp.hidden || '';
}
const abilityName = (slug) => ABILITIES[slug] ?? slug;

function realStats(speciesId, level, ivs, natureIdx, ability) {
  const sp = DEX.get(speciesId);
  const nature = NATURES[natureIdx] ?? NATURES[NEUTRAL_NATURE];
  const out = {};
  sp.base.forEach((b, i) => {
    const core = Math.floor(((2 * b + ivs[i]) * level) / 100);
    if (i === 0) {
      out.hp = sp.slug === 'shedinja' ? 1 : core + level + 10;
    } else {
      let mod = 1;
      if (nature.up === i) mod = 1.1;
      if (nature.down === i) mod = 0.9;
      out[STAT_KEYS[i]] = Math.floor((core + 5) * mod);
    }
  });
  const boost = STAT_ABILITIES[ability];
  if (boost) for (const k of Object.keys(boost)) out[k] = Math.floor(out[k] * boost[k]);
  return out;
}

function sizeFactors(sp) {
  const kg = Math.max(sp.w / 10, 0.1);
  const m = Math.max(sp.h / 10, 0.1);
  return {
    mass: clamp(1 + 0.07 * Math.log2(kg / 60), 0.8, 1.2),
    reach: clamp(1 + 0.06 * Math.log2(m / 1.5), 0.88, 1.12),
    nimble: clamp(1 - 0.04 * Math.log2(kg / 60), 0.88, 1.1),
    hands: SHAPE_HANDS[sp.shape] ?? 0.6,
    legs: SHAPE_LEGS[sp.shape] ?? 0.6,
  };
}

function rawAttributes(sp, s, level) {
  const f = sizeFactors(sp);
  // HP has a level bonus the other stats lack; remove it so the blends weigh like with like.
  const hp = Math.max(1, s.hp - level - 5);
  return {
    SPD: s.spe,
    AGI: (0.7 * s.spe + 0.3 * s.spd) * f.nimble,
    STR: (0.7 * s.atk + 0.3 * hp) * f.mass,
    AWR: 0.5 * s.spa + 0.5 * s.spd,
    THP: (0.6 * Math.max(s.atk, s.spa) + 0.4 * Math.min(s.atk, s.spa)) * (0.55 + 0.45 * f.hands),
    THA: (0.65 * s.spa + 0.35 * s.spd) * (0.3 + 0.7 * f.hands),
    CTH: (0.45 * s.spd + 0.3 * s.spe + 0.25 * s.spa) * (0.3 + 0.7 * f.hands) * f.reach,
    CAR: (0.5 * hp + 0.5 * s.def) * (0.6 + 0.4 * f.hands),
    RBK: (0.45 * s.def + 0.35 * s.atk + 0.2 * hp) * f.mass,
    PBK: (0.45 * s.def + 0.3 * s.spd + 0.25 * hp) * f.mass,
    PRS: (0.5 * s.atk + 0.3 * s.spe + 0.2 * hp) * Math.sqrt(f.mass),
    TAK: (0.5 * s.atk + 0.3 * s.def + 0.2 * hp) * f.mass ** 0.7,
    COV: (0.5 * s.spe + 0.3 * s.spd + 0.2 * s.spa) * f.nimble,
    KPW: s.atk * (0.3 + 0.7 * f.legs),
    KAC: (0.6 * s.spa + 0.4 * s.spd) * (0.3 + 0.7 * f.legs),
    STA: 0.6 * hp + 0.4 * s.def,
  };
}

// The 99.5th-percentile raw value of each attribute among all Pokémon at level 100, perfect IVs.
const RATING_REF = (() => {
  const perfect = [31, 31, 31, 31, 31, 31];
  const cols = Object.fromEntries(ATTR_KEYS.map((k) => [k, []]));
  for (const sp of POKEDEX) {
    const raw = rawAttributes(sp, realStats(sp.id, 100, perfect, NEUTRAL_NATURE, ''), 100);
    for (const k of ATTR_KEYS) cols[k].push(raw[k]);
  }
  return Object.fromEntries(ATTR_KEYS.map((k) => {
    const sorted = cols[k].sort((a, b) => a - b);
    return [k, sorted[Math.floor(sorted.length * 0.995)]];
  }));
})();

function weightedSum(attrs, pos) {
  const w = POSITIONS[pos].w;
  let sum = 0;
  for (const k in w) sum += w[k] * attrs[k];
  return sum;
}

// Position overalls use the same 99.5th-percentile anchor, so a 75 means the same thing at every position.
const POSITION_REF = (() => {
  const perfect = [31, 31, 31, 31, 31, 31];
  const cols = Object.fromEntries(POS_KEYS.map((k) => [k, []]));
  for (const sp of POKEDEX) {
    const attrs = scaleAttributes(rawAttributes(sp, realStats(sp.id, 100, perfect, NEUTRAL_NATURE, ''), 100), {});
    for (const pos of POS_KEYS) cols[pos].push(weightedSum(attrs, pos));
  }
  return Object.fromEntries(POS_KEYS.map((k) => {
    const sorted = cols[k].sort((a, b) => a - b);
    return [k, sorted[Math.floor(sorted.length * 0.995)]];
  }));
})();

function positionOvr(attrs, pos) {
  return clamp(Math.round((99 * weightedSum(attrs, pos)) / POSITION_REF[pos]), 1, 99);
}

function scaleAttributes(raw, mods) {
  const attrs = {};
  for (const k of ATTR_KEYS) attrs[k] = clamp(Math.round((99 * raw[k] * (mods[k] ?? 1)) / RATING_REF[k]), 1, 99);
  return attrs;
}

// Field positions only; kickers and punters are judged on their own two ratings.
const FIELD_POS = POS_KEYS.filter((p) => POSITIONS[p].side !== 'ST');

const cache = new Map();
// A rated player: real stats, attributes (1-99), and an overall for every position.
function rate(speciesId, level, ivs, natureIdx, abilitySlot) {
  const key = `${speciesId}|${level}|${ivs.join(',')}|${natureIdx}|${abilitySlot}`;
  const hit = cache.get(key);
  if (hit) return hit;
  const sp = DEX.get(speciesId);
  const ability = abilityOf(speciesId, abilitySlot);
  const stats = realStats(speciesId, level, ivs, natureIdx, ability);
  const raw = rawAttributes(sp, stats, level);
  const mods = RATING_ABILITIES[ability] ?? {};
  const attrs = scaleAttributes(raw, mods);
  const ovr = {};
  let best = 'QB';
  for (const pos of POS_KEYS) {
    ovr[pos] = positionOvr(attrs, pos);
    if (POSITIONS[pos].side !== 'ST' && ovr[pos] > ovr[best]) best = pos;
  }
  const out = { stats, attrs, ovr, best, ability };
  if (cache.size > 50000) cache.clear();
  cache.set(key, out);
  return out;
}

// Every species this one can still become, including itself.
function evolutionLine(speciesId) {
  const out = [speciesId];
  for (const child of EVOLVES_TO.get(speciesId) ?? []) out.push(...evolutionLine(child));
  return out;
}
function finalForms(speciesId) {
  const kids = EVOLVES_TO.get(speciesId) ?? [];
  if (!kids.length) return [speciesId];
  return kids.flatMap(finalForms);
}

// Potential: the best overall this individual can reach at level 100 in any final form.
// It does not depend on the current level, so it is cached per individual.
const potCache = new Map();
function potentials(player) {
  const key = `${player.species}|${player.ivs.join(',')}|${player.nature}|${player.abilitySlot}`;
  let hit = potCache.get(key);
  if (hit) return hit;
  hit = {};
  for (const form of finalForms(player.species)) {
    const r = rate(form, 100, player.ivs, player.nature, player.abilitySlot);
    for (const pos of POS_KEYS) hit[pos] = Math.max(hit[pos] ?? 0, r.ovr[pos]);
  }
  hit.best = Math.max(...FIELD_POS.map((pos) => hit[pos]));
  if (potCache.size > 20000) potCache.clear();
  potCache.set(key, hit);
  return hit;
}
function potential(player, pos) {
  const pots = potentials(player);
  return pos ? pots[pos] : pots.best;
}

// ---- Experience and levels (the main-series growth-rate curves) ----
function expForLevel(growth, n) {
  if (n <= 1) return 0;
  const n3 = n ** 3;
  switch (growth) {
    case 'fast': return Math.floor((4 * n3) / 5);
    case 'medium': return n3;
    case 'slow': return Math.floor((5 * n3) / 4);
    case 'medium-slow': return Math.max(0, Math.floor((6 * n3) / 5 - 15 * n * n + 100 * n - 140));
    case 'slow-then-very-fast':
      if (n <= 50) return Math.floor((n3 * (100 - n)) / 50);
      if (n <= 68) return Math.floor((n3 * (150 - n)) / 100);
      if (n <= 98) return Math.floor((n3 * Math.floor((1911 - 10 * n) / 3)) / 500);
      return Math.floor((n3 * (160 - n)) / 100);
    case 'fast-then-very-slow':
      if (n <= 15) return Math.floor((n3 * (Math.floor((n + 1) / 3) + 24)) / 50);
      if (n <= 36) return Math.floor((n3 * (n + 14)) / 50);
      return Math.floor((n3 * (Math.floor(n / 2) + 32)) / 50);
    default: return n3;
  }
}
function levelForExp(growth, exp) {
  let lvl = 1;
  while (lvl < 100 && expForLevel(growth, lvl + 1) <= exp) lvl++;
  return lvl;
}

// The best multiplier any of the attacker's types gets against the defender, after the defender's ability.
function typeFactor(attTypes, attAbility, defTypes, defAbility) {
  let best = 0;
  for (const a of attTypes) {
    let f = 1;
    for (const d of defTypes) {
      let x = TYPE_CHART[a][d] / 100;
      if (x === 0 && attAbility === 'scrappy' && d === TYPE.ghost && (a === TYPE.normal || a === TYPE.fighting)) x = 1;
      f *= x;
    }
    if (defAbility === 'levitate' && a === TYPE.ground) f = 0;
    if (defAbility === 'thick-fat' && (a === TYPE.fire || a === TYPE.ice)) f *= 0.5;
    if (f >= 2 && (defAbility === 'filter' || defAbility === 'solid-rock' || defAbility === 'prism-armor')) f *= 0.75;
    best = Math.max(best, f);
  }
  return best;
}

// Rating multiplier for a matchup: 0.92 (no effect) to 1.08 (4x super effective).
function typeMod(factor) {
  if (factor === 0) return 0.92;
  return 1 + 0.04 * Math.max(-2, Math.min(2, Math.log2(factor)));
}

// Where the ball sits before each logged play, and after the last one.
function ballSpots(result) {
  const log = result.log;
  const spots = [];
  for (let i = 0; i < log.length; i++) {
    const e = log[i];
    if (e.kind === 'note') { spots.push(null); continue; }
    const start = e.startYl ?? e.yl;
    let end = null;
    for (let j = i + 1; j < log.length; j++) {
      const n = log[j];
      if (n.kind === 'note' || n.kind === 'pat') continue;
      if (n.kind === 'kickoff') break;
      end = { poss: n.poss, yl: n.startYl ?? n.yl };
      break;
    }
    if (!end) {
      if (e.scoring === 'TD') end = { poss: e.poss, yl: 100 };
      else if (e.scoring === 'SAFETY') end = { poss: e.poss, yl: 0 };
      else if (e.kind === 'kickoff') end = { poss: e.poss, yl: e.yl };
      else end = { poss: e.poss, yl: Math.max(0, Math.min(100, start + (e.yards ?? 0))) };
    }
    spots.push({ poss: e.poss, start, end, down: e.down, dist: e.dist, kind: e.kind });
  }
  return spots;
}

      const label = y <= 50 ? y : 100 - y;
      lines.push(`<text x="${x}" y="236" text-anchor="middle" font-family="Graduate, Georgia, serif" font-size="22" fill="rgb(255 255 255 / .7)">${label}</text>`);
      lines.push(`<text x="${x}" y="42" text-anchor="middle" font-family="Graduate, Georgia, serif" font-size="22" fill="rgb(255 255 255 / .7)" transform="rotate(180 ${x} 34)">${label}</text>`);
    }
  }
  const stripes = [];
  for (let i = 0; i < 10; i++) stripes.push(`<rect x="${100 + i * 100}" y="0" width="100" height="260" style="fill:${i % 2 ? 'var(--turf-2)' : 'var(--turf)'}"/>`);
  let marks = '';
  if (spot) {
    const los = fieldX(spot.poss, spot.start);
    const fd = spot.down ? fieldX(spot.poss, Math.min(100, spot.start + spot.dist)) : null;
    const endX = fieldX(spot.end.poss, spot.end.yl);
    const color = teams[spot.poss].color;
    marks += `<line x1="${los}" y1="0" x2="${los}" y2="260" stroke="#8fd0ff" stroke-width="4"/>`;
    if (fd !== null) marks += `<line x1="${fd}" y1="0" x2="${fd}" y2="260" stroke="#f2c230" stroke-width="4"/>`;
    if (Math.abs(endX - los) > 2) {
      marks += `<path d="M ${los} 130 Q ${(los + endX) / 2} ${spot.kind === 'pass' ? 60 : 118} ${endX} 130" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round" opacity="0.95"/>`;
    }
    marks += `<g class="ball" transform="translate(${endX} 130)"><ellipse rx="15" ry="10" fill="#7a4a24" stroke="#fff" stroke-width="2.5"/><line x1="-6" y1="0" x2="6" y2="0" stroke="#fff" stroke-width="2"/></g>`;
  }
  const ez = (side) => {
    const x = side === 0 ? 0 : 1100;
    const cx = x + 50;
    return `<rect x="${x}" y="0" width="100" height="260" fill="${teams[side].color}"/>
      <text x="${cx}" y="130" text-anchor="middle" dominant-baseline="middle" font-family="Graduate, Georgia, serif" font-size="30" fill="#fff" transform="rotate(${side === 0 ? -90 : 90} ${cx} 130)">${esc(teams[side].abbr)}</text>`;
  };
  return `<div class="field-wrap"><svg viewBox="0 0 1200 260" role="img" aria-label="Football field showing the ball position">
    ${stripes.join('')}${ez(0)}${ez(1)}${lines.join('')}
    <rect x="1" y="1" width="1198" height="258" fill="none" stroke="rgb(255 255 255 / .8)" stroke-width="3"/>
    ${marks}
  </svg></div>`;
}

// ---------------------------------------------------------------- play-by-play
function playList(result, { upTo = null, current = null } = {}) {
  const teams = result.teams;
  const rows = [];
  const last = upTo ?? result.log.length - 1;
  for (let i = 0; i <= last; i++) {
    const e = result.log[i];
    if (e.kind === 'note') { rows.push(`<div class="play note"><span class="when">${qLabel(e.q)}</span><span class="txt">${esc(e.text)}</span></div>`); continue; }
    const sit = e.down && e.kind !== 'kickoff' && e.kind !== 'pat' ? `${ordinal(e.down)} & ${e.yl + e.dist >= 100 ? 'Goal' : e.dist} at ${spotText(teams, e.poss, e.yl)}` : '';
    rows.push(`<div class="play${e.scoring ? ' score' : ''}${current === i ? ' cur' : ''}" data-action="show-play" data-i="${i}">
      <span class="when">${qLabel(e.q)} ${fmtClock(e.clock)}</span>
      <span class="txt"><span class="tm-tag" style="background:${teams[e.poss]?.color}"></span>${sit ? `<span class="sit">${esc(sit)}</span><br>` : ''}${esc(e.text)}</span>
    </div>`);
  }
  return `<div class="plays" id="plays">${rows.reverse().join('')}</div>`;
}

// ---------------------------------------------------------------- box score
function boxScore(result) {
  const t = result.teamStats;
  const teams = result.teams;
  const top = (s) => fmtClock(s);
  const rows = [
    ['First downs', t[0].firstDowns, t[1].firstDowns],
    ['Total yards', t[0].yards, t[1].yards],
    ['Passing yards', t[0].passYds, t[1].passYds],
    ['Rushing yards', t[0].rushYds, t[1].rushYds],
    ['Rushes', t[0].rushAtt, t[1].rushAtt],
    ['Third downs', `${t[0].thirdConv}/${t[0].thirdAtt}`, `${t[1].thirdConv}/${t[1].thirdAtt}`],
    ['Fourth downs', `${t[0].fourthConv}/${t[0].fourthAtt}`, `${t[1].fourthConv}/${t[1].fourthAtt}`],
    ['Sacks allowed', t[0].sacked, t[1].sacked],
    ['Turnovers', t[0].turnovers, t[1].turnovers],
    ['Penalties', `${t[0].penalties}-${t[0].penYds}`, `${t[1].penalties}-${t[1].penYds}`],
    ['Time of possession', top(t[0].top), top(t[1].top)],
  ];
  const teamTable = `<div class="table-wrap"><table class="data"><thead><tr><th class="l">Team stats</th><th>${esc(teams[0].abbr)}</th><th>${esc(teams[1].abbr)}</th></tr></thead>
    <tbody>${rows.map((r) => `<tr><td class="l">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table></div>`;

  const section = (title, cols, pick, fmt) => {
    const body = [0, 1].map((side) => {
      const lines = result.players.filter((p) => p.side === side && pick(p)).sort((a, b) => pick(b) - pick(a));
      if (!lines.length) return '';
      return lines.map((p) => `<tr><td class="l"><span class="tm-tag" style="background:${teams[side].color}"></span>${esc(p.name)} <span class="faint">${esc(p.slot)}</span></td>${fmt(p).map((v) => `<td>${v}</td>`).join('')}</tr>`).join('');
    }).join('');
    if (!body) return '';
    return `<div class="table-wrap"><table class="data"><thead><tr><th class="l">${title}</th>${cols.map((c) => `<th>${c}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`;
  };
  const avg = (a, b) => (b ? (a / b).toFixed(1) : '0.0');
  return `<div class="stack">
    ${teamTable}
    ${section('Passing', ['C/Att', 'Yds', 'TD', 'Int', 'Sck', 'Lng'], (p) => p.pass.att + p.pass.sk, (p) => [`${p.pass.cmp}/${p.pass.att}`, p.pass.yds, p.pass.td, p.pass.int, p.pass.sk, p.pass.lng])}
    ${section('Rushing', ['Car', 'Yds', 'Avg', 'TD', 'Lng', 'Fum'], (p) => p.rush.car, (p) => [p.rush.car, p.rush.yds, avg(p.rush.yds, p.rush.car), p.rush.td, p.rush.lng, p.rush.fum])}
    ${section('Receiving', ['Rec', 'Tgt', 'Yds', 'Avg', 'TD', 'Lng'], (p) => p.rec.tgt, (p) => [p.rec.rec, p.rec.tgt, p.rec.yds, avg(p.rec.yds, p.rec.rec), p.rec.td, p.rec.lng])}
    ${section('Defense', ['Tkl', 'TFL', 'Sck', 'Int', 'PD', 'FF'], (p) => p.def.tkl + p.def.int * 3 + p.def.pd + p.def.sck * 2, (p) => [p.def.tkl, p.def.tfl, p.def.sck, p.def.int, p.def.pd, p.def.ff])}
    ${section('Kicking', ['FG', 'Lng', 'XP'], (p) => p.kick.fga + p.kick.xpa, (p) => [`${p.kick.fgm}/${p.kick.fga}`, p.kick.lng, `${p.kick.xpm}/${p.kick.xpa}`])}
    ${section('Punting', ['No', 'Yds', 'Avg', 'Lng'], (p) => p.punt.n, (p) => [p.punt.n, p.punt.yds, avg(p.punt.yds, p.punt.n), p.punt.lng])}
    ${section('Returns', ['No', 'Yds', 'TD'], (p) => p.ret.n, (p) => [p.ret.n, p.ret.yds, p.ret.td])}
  </div>`;
}

// ---------------------------------------------------------------- drive chart
function driveChart(result) {

  const posBars = POS_KEYS.map((k) => ({ label: POSITIONS[k].name, value: r.ovr[k], hot: k === pos, title: `Potential ${pots[k]}` }));

      </div>
      <div class="big-ovr"><div class="eyebrow">${pos} OVR</div><div class="v">${r.ovr[pos]}</div><div class="faint small">POT ${pots[pos]}</div></div>

      <b>${esc(abilityTitle(r.ability))}</b> <span class="muted">${esc(perkText(r.ability))}</span></div>
    <div class="card-section"><div class="spread" style="margin-bottom:8px"><span class="eyebrow">Overall by position</span><span class="faint small">Hover for potential</span></div>${barRows(posBars)}</div>
    <div class="card-section"><div class="spread" style="margin-bottom:8px"><span class="eyebrow">Football ratings at Lv ${p.level}</span><span class="faint small">Highlighted = used at ${pos}</span></div>${barRows(attrBars)}</div>
    <div class="card-section"><div class="eyebrow" style="margin-bottom:8px">Real stats (base → at Lv ${p.level})</div>

function evolutionRow(sp) {
  let root = sp;
  while (root.from) root = DEX.get(root.from);
  const parts = [];
  const walk = (s, depth) => {
    parts.push(`${depth ? `<span class="arrow">→ Lv ${s.evoLvl}</span>` : ''}<span>${s.id === sp.id ? `<b>${esc(s.name)}</b>` : esc(s.name)}</span>`);
    for (const k of EVOLVES_TO.get(s.id) ?? []) walk(DEX.get(k), depth + 1);
  };
  walk(root, 0);
  if (parts.length === 1) return '<div class="card-section"><div class="eyebrow" style="margin-bottom:6px">Evolution</div><div class="small muted">Does not evolve.</div></div>';
  return `<div class="card-section"><div class="eyebrow" style="margin-bottom:6px">Evolution line</div><div class="evo">${parts.join('')}</div></div>`;
}

// ---------------------------------------------------------------- margin histogram
function marginHistogram(margins, teams) {
  const binSize = 7;
  const lo = -42;
  const hi = 42;
  const bins = [];
  for (let m = lo; m <= hi; m += binSize) bins.push({ from: m - 3, to: m + 3, center: m, n: 0 });
  for (const m of margins) {
    const c = Math.max(lo, Math.min(hi, Math.round(m / binSize) * binSize));
    bins.find((b) => b.center === c).n++;
  }
  const max = Math.max(...bins.map((b) => b.n), 1);
  const W = 600, H = 200, padL = 34, padB = 26, padT = 10;
  const bw = (W - padL) / bins.length;
  const yTicks = niceTicks(max);
  const y = (v) => H - padB - ((H - padB - padT) * v) / yTicks.at(-1);
  const bars = bins.map((b, i) => {
    const x = padL + i * bw + 2;
    const w = Math.min(24, bw - 4);
    const x0 = x + (bw - 4 - w) / 2;
    const h = H - padB - y(b.n);
    const fill = b.center > 0 ? 'var(--home)' : b.center < 0 ? 'var(--away)' : 'var(--ink-3)';
    const who = b.center > 0 ? `${teams[0].name} by ${Math.max(1, b.from)}-${b.to}` : b.center < 0 ? `${teams[1].name} by ${Math.max(1, -b.to)}-${-b.from}` : 'Within 3 points';
    const label = b.center === lo ? `${teams[1].name} by 39+` : b.center === hi ? `${teams[0].name} by 39+` : who;
    const path = h > 0 ? `M ${x0} ${H - padB} V ${y(b.n) + 4} Q ${x0} ${y(b.n)} ${x0 + 4} ${y(b.n)} H ${x0 + w - 4} Q ${x0 + w} ${y(b.n)} ${x0 + w} ${y(b.n) + 4} V ${H - padB} Z` : '';
    return `<g data-tip="${esc(label)}: ${b.n} game${b.n === 1 ? '' : 's'}"><rect x="${padL + i * bw}" y="${padT}" width="${bw}" height="${H - padB - padT}" fill="transparent"/>${path ? `<path d="${path}" style="fill:${fill}"/>` : ''}</g>`;
  }).join('');
  const grid = yTicks.map((t) => `<line x1="${padL}" x2="${W}" y1="${y(t)}" y2="${y(t)}" style="stroke:var(--line)" stroke-width="1"/><text x="${padL - 6}" y="${y(t) + 4}" text-anchor="end" font-size="11" style="fill:var(--ink-3)">${t}</text>`).join('');
  const xLabels = bins.map((b, i) => (i % 2 === 0 ? `<text x="${padL + i * bw + bw / 2}" y="${H - 8}" text-anchor="middle" font-size="11" style="fill:var(--ink-3)">${b.center === 0 ? '0' : b.center > 0 ? `+${b.center}` : b.center}</text>` : '')).join('');
  return `<div class="hist"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Final margin histogram">${grid}${bars}${xLabels}</svg></div>
    <div class="legend"><span><span class="sw" style="background:var(--home)"></span>${esc(teams[0].name)} won by (points)</span><span><span class="sw" style="background:var(--away)"></span>${esc(teams[1].name)} won by</span><span><span class="sw" style="background:var(--ink-3)"></span>Within 3</span></div>`;
}

function niceTicks(max) {
  const step = max <= 5 ? 1 : max <= 10 ? 2 : max <= 25 ? 5 : max <= 50 ? 10 : max <= 100 ? 20 : 50;
  const ticks = [];
  for (let t = 0; t <= max + step - 1; t += step) ticks.push(t);
  if (ticks.at(-1) < max) ticks.push(ticks.at(-1) + step);
  return ticks;
}

// ---- engine/lineup.js
// Lineup slots, individual players, and the lineup optimizer.



const SLOTS = [
  { id: 'QB', pos: 'QB' }, { id: 'RB', pos: 'RB' },
  { id: 'WR1', pos: 'WR' }, { id: 'WR2', pos: 'WR' }, { id: 'WR3', pos: 'WR' }, { id: 'TE', pos: 'TE' },
  { id: 'LT', pos: 'OL' }, { id: 'LG', pos: 'OL' }, { id: 'C', pos: 'OL' }, { id: 'RG', pos: 'OL' }, { id: 'RT', pos: 'OL' },
  { id: 'LE', pos: 'DL' }, { id: 'DT1', pos: 'DL' }, { id: 'DT2', pos: 'DL' }, { id: 'RE', pos: 'DL' },
  { id: 'WLB', pos: 'LB' }, { id: 'MLB', pos: 'LB' }, { id: 'SLB', pos: 'LB' },
  { id: 'CB1', pos: 'CB' }, { id: 'CB2', pos: 'CB' }, { id: 'FS', pos: 'S' }, { id: 'SS', pos: 'S' },
  { id: 'K', pos: 'K' }, { id: 'P', pos: 'P' },
];
const SLOT_POS = Object.fromEntries(SLOTS.map((s) => [s.id, s.pos]));
const SLOT_GROUPS = [
  { name: 'Offense', slots: ['QB', 'RB', 'WR1', 'WR2', 'WR3', 'TE', 'LT', 'LG', 'C', 'RG', 'RT'] },
  { name: 'Defense', slots: ['LE', 'DT1', 'DT2', 'RE', 'WLB', 'MLB', 'SLB', 'CB1', 'CB2', 'FS', 'SS'] },
  { name: 'Special teams', slots: ['K', 'P'] },
];

// How much one rating point at each position is worth to the team. Quarterback matters most.
const IMPORTANCE = { QB: 1.7, RB: 0.9, WR: 1.05, TE: 0.8, OL: 0.95, DL: 1.0, LB: 0.85, CB: 1.05, S: 0.85, K: 0.55, P: 0.35 };

const PERFECT = [31, 31, 31, 31, 31, 31];

// A player is one individual Pokémon: species, level, IVs, nature and ability slot.
function makePlayer({ pid, species, level, ivs = PERFECT, nature = NEUTRAL_NATURE, abilitySlot = 0, num = 0 }) {
  return { pid, species, level, ivs, nature, abilitySlot, num };
}

function randomPlayer(rng, pid, species, level) {
  const sp = DEX.get(species);
  const slots = [0];
  if (sp.abil[1]) slots.push(1);
  const abilitySlot = sp.hidden && rng.chance(0.12) ? 2 : rng.pick(slots);
  return makePlayer({
    pid, species, level,
    ivs: Array.from({ length: 6 }, () => rng.int(0, 31)),
    nature: rng.int(0, NATURES.length - 1),
    abilitySlot,
  });
}

const ratingOf = (p) => rate(p.species, p.level, p.ivs, p.nature, p.abilitySlot);
const nameOf = (p) => DEX.get(p.species).name;

// Small extra value for game-time abilities, so the optimizer and AI GMs notice them.
const PERK_VALUE = {
  intimidate: 2, 'speed-boost': 2, regenerator: 1, moxie: 1, 'sticky-hold': 1, sturdy: 1, sniper: 1, technician: 1,
  truant: -12, 'slow-start': -6, defeatist: -3,
};
const perkValue = (p) => PERK_VALUE[abilityOf(p.species, p.abilitySlot)] ?? 0;

function slotValue(p, pos) {
  return IMPORTANCE[pos] * (ratingOf(p).ovr[pos] + perkValue(p));
}

// Exhibition players: perfect IVs, a neutral nature, and whichever ability slot rates best.
function exhibitionPlayer(species, level, pid = `x${species}`) {
  const sp = DEX.get(species);
  let best = null;
  for (const slot of [0, 1, 2]) {
    if (slot === 1 && !sp.abil[1]) continue;
    if (slot === 2 && !sp.hidden) continue;
    const p = makePlayer({ pid, species, level, abilitySlot: slot });
    const r = ratingOf(p);
    const score = r.ovr[r.best] + perkValue(p);
    if (!best || score > best.score) best = { p, score };
  }
  return best.p;
}

// Fill every slot from a pool of players: greedy start, then swaps until no swap helps.
function autoLineup(players, { locked = {} } = {}) {
  const lineup = Object.fromEntries(SLOTS.map((s) => [s.id, null]));
  const used = new Set();
  for (const [slot, pid] of Object.entries(locked)) {
    if (pid && players.some((p) => p.pid === pid)) { lineup[slot] = pid; used.add(pid); }
  }
  const byId = new Map(players.map((p) => [p.pid, p]));
  const open = SLOTS.filter((s) => !lineup[s.id]);
  const pairs = [];
  for (const p of players) {
    if (used.has(p.pid)) continue;
    for (const s of open) pairs.push({ p, s, v: slotValue(p, s.pos) });
  }
  pairs.sort((a, b) => b.v - a.v);
  for (const { p, s } of pairs) {
    if (lineup[s.id] || used.has(p.pid)) continue;
    lineup[s.id] = p.pid;
    used.add(p.pid);
  }
  const free = new Set(open.map((s) => s.id));
  const val = (pid, slot) => (pid ? slotValue(byId.get(pid), SLOT_POS[slot]) : 0);
  for (let pass = 0; pass < 6; pass++) {
    let changed = false;
    const ids = [...free];
    for (let i = 0; i < ids.length; i++) {
      for (let j = i + 1; j < ids.length; j++) {
        const a = ids[i], b = ids[j];
        if (SLOT_POS[a] === SLOT_POS[b]) continue;
        const now = val(lineup[a], a) + val(lineup[b], b);
        const swap = val(lineup[b], a) + val(lineup[a], b);
        if (swap > now + 0.01) { [lineup[a], lineup[b]] = [lineup[b], lineup[a]]; changed = true; }
      }
    }
    for (const p of players) {
      if (used.has(p.pid)) continue;
      let bestSlot = null, gain = 0.01;
      for (const s of ids) {
        const g = slotValue(p, SLOT_POS[s]) - val(lineup[s], s);
        if (g > gain) { gain = g; bestSlot = s; }
      }
      if (bestSlot) {
        if (lineup[bestSlot]) used.delete(lineup[bestSlot]);
        lineup[bestSlot] = p.pid;
        used.add(p.pid);
        changed = true;
      }
    }
    if (!changed) break;
  }
  return lineup;
}

function teamStrength(lineup, players) {
  const byId = new Map(players.map((p) => [p.pid, p]));
  let off = 0, def = 0, offW = 0, defW = 0;
  for (const s of SLOTS) {
    const p = byId.get(lineup[s.id]);
    const side = POSITIONS[s.pos].side;
    const w = IMPORTANCE[s.pos];
    const v = p ? ratingOf(p).ovr[s.pos] : 0;
    if (side === 'D') { def += w * v; defW += w; } else { off += w * v; offW += w; }
  }
  return { off: Math.round(off / offW), def: Math.round(def / defW), ovr: Math.round((off + def) / (offW + defW)) };
}

// ---- Theme pools for exhibition games ----
const STARTER_LINES = [1, 4, 7, 152, 155, 158, 252, 255, 258, 387, 390, 393, 495, 498, 501, 650, 653, 656, 722, 725, 728, 810, 813, 816, 906, 909, 912];
const PSEUDO_LINES = [147, 246, 371, 374, 443, 633, 704, 782, 885, 996];
const lineOf = (root) => {
  const out = [root];
  for (const p of POKEDEX) if (out.includes(p.from)) out.push(p.id);
  return out;
};

const THEMES = (() => {
  const t = [];
  const gens = ['Kanto', 'Johto', 'Hoenn', 'Sinnoh', 'Unova', 'Kalos', 'Alola', 'Galar', 'Paldea'];
  gens.forEach((region, i) => t.push({ id: `gen${i + 1}`, name: `${region} All-Stars`, group: 'Region', filter: (p) => p.gen === i + 1 }));
  ['normal', 'fire', 'water', 'grass', 'electric', 'ice', 'fighting', 'poison', 'ground', 'flying', 'psychic', 'bug', 'rock', 'ghost', 'dragon', 'dark', 'steel', 'fairy']
    .forEach((type) => t.push({ id: `type-${type}`, name: `Team ${type[0].toUpperCase()}${type.slice(1)}`, group: 'Type', type }));
  const starters = new Set(STARTER_LINES.flatMap(lineOf));
  const pseudos = new Set(PSEUDO_LINES.flatMap(lineOf));
  t.push({ id: 'legends', name: 'Legends & Mythicals', group: 'Special', filter: (p) => p.leg || p.myth });
  t.push({ id: 'starters', name: 'Starter Squad', group: 'Special', filter: (p) => starters.has(p.id) });
  t.push({ id: 'pseudo', name: 'Pseudo-Legend Club', group: 'Special', filter: (p) => pseudos.has(p.id) });
  t.push({ id: 'standard', name: 'No Legends Allowed', group: 'Special', filter: (p) => !p.leg && !p.myth });
  t.push({ id: 'little', name: 'Little Cup (unevolved)', group: 'Special', filter: (p) => !p.from && !p.leg && !p.myth && POKEDEX.some((q) => q.from === p.id) });
  t.push({ id: 'everyone', name: 'Every Pokémon', group: 'Special', filter: () => true });
  return t;
})();

function themePool(themeId) {
  const theme = THEMES.find((t) => t.id === themeId) ?? THEMES[0];
  if (theme.type) return POKEDEX.filter((p) => p.types.includes(TYPE[theme.type])).map((p) => p.id);
  return POKEDEX.filter(theme.filter).map((p) => p.id);
}

// ---- engine/duels.js
// The one-on-one matchups that decide every snap.
// A matchup compares two rating blends as a ratio, so two level-50 teams play the same brand of
// football as two level-100 teams. DUEL_REF (calibration.js) holds the typical log-ratio for
// starters at each matchup, so an edge of 0 means "an ordinary matchup".

const BLENDS = {
  RBK: [['RBK', 1]],
  HOLD: [['TAK', 0.5], ['STR', 0.5]],
  ELUDE: [['AGI', 0.4], ['STR', 0.35], ['SPD', 0.25]],
  TAK: [['TAK', 1]],
  STR: [['STR', 1]],
  SPD: [['SPD', 1]],
  AGI: [['AGI', 1]],
  PRS: [['PRS', 1]],
  PBK: [['PBK', 1]],
  ROUTE: [['SPD', 0.45], ['AGI', 0.3], ['AWR', 0.25]],
  COVER: [['COV', 0.55], ['SPD', 0.3], ['AWR', 0.15]],
  THA: [['THA', 1]],
  COV: [['COV', 1]],
  CTH: [['CTH', 1]],
  YAC: [['SPD', 0.4], ['AGI', 0.4], ['STR', 0.2]],
};

// a = the first player's blend, b = the opponent's blend; pairs are typical slot matchups.
const DUELS = {
  runBlock: { a: 'RBK', b: 'HOLD', pairs: [['LG', 'DT1'], ['C', 'DT2'], ['RG', 'MLB'], ['LT', 'RE'], ['RT', 'LE'], ['TE', 'SLB']] },
  elude: { a: 'ELUDE', b: 'TAK', pairs: [['RB', 'DT1'], ['RB', 'MLB'], ['RB', 'LE'], ['RB', 'WLB'], ['RB', 'SS']] },
  power: { a: 'STR', b: 'STR', pairs: [['RB', 'DT1'], ['RB', 'MLB'], ['RB', 'LE'], ['RB', 'WLB'], ['RB', 'SS']] },
  breakaway: { a: 'SPD', b: 'SPD', pairs: [['RB', 'FS'], ['RB', 'SS'], ['RB', 'CB1'], ['RB', 'CB2']] },
  passRush: { a: 'PRS', b: 'PBK', pairs: [['LE', 'RT'], ['DT1', 'RG'], ['DT2', 'LG'], ['RE', 'LT']] },
  route: { a: 'ROUTE', b: 'COVER', pairs: [['WR1', 'CB1'], ['WR2', 'CB2'], ['WR3', 'SLB'], ['TE', 'MLB'], ['RB', 'WLB']] },
  throw: { a: 'THA', b: 'COV', pairs: [['QB', 'CB1'], ['QB', 'CB2'], ['QB', 'SLB'], ['QB', 'MLB'], ['QB', 'FS']] },
  catch: { a: 'CTH', b: 'COV', pairs: [['WR1', 'CB1'], ['WR2', 'CB2'], ['WR3', 'SLB'], ['TE', 'MLB'], ['RB', 'WLB']] },
  yac: { a: 'YAC', b: 'TAK', pairs: [['WR1', 'CB1'], ['WR2', 'CB2'], ['WR3', 'SLB'], ['TE', 'MLB'], ['RB', 'WLB'], ['WR1', 'FS']] },
  escape: { a: 'AGI', b: 'SPD', pairs: [['QB', 'LE'], ['QB', 'RE'], ['QB', 'DT1']] },
  returns: { a: 'SPD', b: 'SPD', pairs: [['RB', 'WLB'], ['WR3', 'SLB'], ['CB2', 'SS']] },
};

function blendValue(attrs, blend) {
  let v = 0;
  for (const [k, w] of BLENDS[blend]) v += w * attrs[k];
  return Math.max(1, v);
}

// ---- engine/calibration.js
// Generated by scripts/calibrate.mjs from 93 lineups. Do not edit.
// The typical log-ratio of each matchup between ordinary starters (see duels.js).
const DUEL_REF = {
  "runBlock": -0.0273,
  "elude": 0.0021,
  "power": -0.19,
  "breakaway": -0.0193,
  "passRush": 0.0535,
  "route": -0.0319,
  "throw": 0.0953,
  "catch": 0.0121,
  "yac": 0.2136,
  "escape": 0.3228,
  "returns": 0.11
};

// ---- engine/match.js
// Play-by-play football game between two lineups of rated Pokémon.
// Every snap is a set of one-on-one matchups (blocker vs rusher, runner vs tackler, receiver vs
// cover man). Each matchup uses the two players' ratings, their type matchup, and their abilities.






const QUARTER = 900;
const OT_LENGTH = 600;
const SPEED_KEYS = new Set(['SPD', 'AGI']);
const POWER_KEYS = new Set(['SPD', 'AGI', 'STR', 'PRS', 'TAK', 'THP', 'KPW']);

function toMatchPlayer(p, slot) {
  const r = ratingOf(p);
  return {
    pid: p.pid, slot, num: p.num ?? 0, level: p.level, species: p.species, name: nameOf(p),
    types: DEX.get(p.species).types, ability: r.ability, attrs: r.attrs, ovr: r.ovr,
    loafing: false, truantTick: 0, moxie: 0,
  };
}

// team: { name, abbr, color, lineup: {slot: pid}, players: [player], strategy }
function prepareTeam(team) {
  const byId = new Map(team.players.map((p) => [p.pid, p]));
  const on = {};
  for (const s of SLOTS) {
    const p = byId.get(team.lineup[s.id]);
    if (!p) throw new Error(`${team.name} has no player at ${s.id}`);
    on[s.id] = toMatchPlayer(p, s.id);
  }
  return {
    id: team.id, name: team.name, abbr: team.abbr, color: team.color,
    on, strategy: { runBias: 0, aggression: 0.5, blitz: 0.5, ...(team.strategy ?? {}) },
  };
}

function pickWeather(rng, teams) {
  for (const t of teams) {
    for (const s of SLOTS) {
      const p = t.on[s.id];
      if (WEATHER_SETTERS[p.ability]) return { kind: WEATHER_SETTERS[p.ability], source: p, team: t };
    }
  }
  const r = rng.next();
  const kind = r < 0.62 ? 'clear' : r < 0.77 ? 'rain' : r < 0.87 ? 'sun' : r < 0.92 ? 'sand' : 'snow';
  return { kind, source: null, team: null };
}

const newPlayerLine = (p, side) => ({
  pid: p.pid, name: p.name, slot: p.slot, side, species: p.species, num: p.num,
  pass: { cmp: 0, att: 0, yds: 0, td: 0, int: 0, sk: 0, skYds: 0, lng: 0 },
  rush: { car: 0, yds: 0, td: 0, lng: 0, fum: 0 },
  rec: { tgt: 0, rec: 0, yds: 0, td: 0, lng: 0 },
  def: { tkl: 0, sck: 0, int: 0, ff: 0, pd: 0, tfl: 0, td: 0 },
  kick: { fgm: 0, fga: 0, lng: 0, xpm: 0, xpa: 0 },
  punt: { n: 0, yds: 0, lng: 0 },
  ret: { n: 0, yds: 0, td: 0 },
});
const newTeamLine = () => ({
  firstDowns: 0, plays: 0, yards: 0, passYds: 0, rushYds: 0, turnovers: 0, penalties: 0, penYds: 0,
  top: 0, thirdAtt: 0, thirdConv: 0, fourthAtt: 0, fourthConv: 0, sacked: 0, rushAtt: 0, passAtt: 0,
});

function simulateGame(homeTeam, awayTeam, opts = {}) {
  const rng = makeRng(opts.seed ?? 1);
  const teams = [prepareTeam(homeTeam), prepareTeam(awayTeam)];
  const weather = opts.weather ? { kind: opts.weather, source: null, team: null } : pickWeather(rng, teams);
  const g = {
    rng, teams, weather: weather.kind, q: 1, clock: QUARTER, poss: 0, yl: 25, down: 1, dist: 10,
    score: [0, 0], byQuarter: [[0, 0, 0, 0], [0, 0, 0, 0]], over: false, ot: false,
    allowTie: opts.allowTie !== false, log: [], drives: [], drive: null, logOn: opts.log !== false,
    pendingPAT: null, kickoffBy: null, snapClock: QUARTER, freeKick: false, openingKicker: 0,
    players: new Map(), team: [newTeamLine(), newTeamLine()], neutral: !!opts.neutral,
  };
  for (const [side, t] of teams.entries()) for (const s of SLOTS) g.players.set(t.on[s.id].pid + '@' + side, newPlayerLine(t.on[s.id], side));

  if (weather.source) note(g, `${weather.source.name}'s ${abilityLabel(weather.source.ability)}: ${WEATHER[weather.kind].name.toLowerCase()} for the whole game.`);
  else if (weather.kind !== 'clear') note(g, `Weather: ${WEATHER[weather.kind].name.toLowerCase()}.`);

  const receiver = rng.chance(0.5) ? 0 : 1;
  g.openingKicker = 1 - receiver;
  g.kickoffBy = g.openingKicker;
  note(g, `${teams[receiver].name} win the toss and will receive.`);

  let guard = 0;
  while (!g.over && guard++ < 2000) {
    if (g.pendingPAT !== null) { afterTouchdown(g); continue; }
    if (g.clock <= 0) { endQuarter(g); continue; }
    if (g.kickoffBy !== null) { kickoff(g); continue; }
    scrimmage(g);
  }
  if (g.drive) endDrive(g, 'End of game');

  const winner = g.score[0] === g.score[1] ? null : g.score[0] > g.score[1] ? 0 : 1;
  return {
    seed: opts.seed ?? 1,
    teams: teams.map((t) => ({ id: t.id, name: t.name, abbr: t.abbr, color: t.color })),
    score: g.score, byQuarter: g.byQuarter, winner, ot: g.ot, weather: g.weather,
    weatherSource: weather.source ? { name: weather.source.name, ability: weather.source.ability } : null,
    log: g.log, drives: g.drives, teamStats: g.team,
    players: [...g.players.values()],
  };
}

// ---------- helpers ----------
const abilityLabel = (slug) => slug.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
const off = (g) => g.teams[g.poss];
const def = (g) => g.teams[1 - g.poss];
const line = (g, p, side) => g.players.get(p.pid + '@' + side);
const diffFor = (g, side) => g.score[side] - g.score[1 - side];
const gameSecondsLeft = (g) => (g.q >= 5 ? g.clock : (4 - g.q) * QUARTER + g.clock);

function spot(g, yl) {
  const y = Math.round(yl);
  if (y === 50) return 'midfield';
  return y < 50 ? `${off(g).abbr} ${y}` : `${def(g).abbr} ${100 - y}`;
}

function note(g, text) {
  if (g.logOn) g.log.push({ kind: 'note', q: g.q, clock: g.clock, text, score: [...g.score] });
}

function logPlay(g, entry) {
  if (!g.logOn) return;
  g.log.push({
    q: g.q, clock: g.snapClock, poss: g.poss, down: g.down, dist: g.dist, yl: g.yl,
    score: [...g.score], ...entry,
  });
}

// A player's rating for this snap after weather, quarter, score and ability effects.
function eff(g, side, p, key) {
  let v = p.attrs[key];
  const ab = p.ability;
  const w = WEATHER[g.weather];
  if (SPEED_KEYS.has(key)) {
    if (w.rush && ab === w.rush) v *= 1.35;
    if (g.weather === 'snow' && !p.types.includes(TYPE.ice)) v *= 0.97;
    if (ab === 'speed-boost') v *= 1 + 0.04 * (Math.min(g.q, 4) - 1);
  }
  if (ab === 'slow-start' && g.q === 1 && POWER_KEYS.has(key)) v *= 0.5;
  if (ab === 'defeatist' && diffFor(g, side) <= -14) v *= 0.75;
  if (ab === 'guts' && diffFor(g, side) < 0 && (key === 'STR' || key === 'TAK')) v *= 1.1;
  if (ab === 'moxie' && key === 'PRS') v *= 1 + 0.05 * p.moxie;
  if (g.weather === 'rain') { if (p.types.includes(TYPE.water)) v *= 1.03; if (p.types.includes(TYPE.fire)) v *= 0.97; }
  if (g.weather === 'sun') { if (p.types.includes(TYPE.fire)) v *= 1.03; if (p.types.includes(TYPE.water)) v *= 0.97; }
  if (g.weather === 'sand' && [TYPE.rock, TYPE.ground, TYPE.steel].some((t) => p.types.includes(t))) v *= 1.03;
  if (g.weather === 'snow' && p.types.includes(TYPE.ice)) v *= 1.03;
  if (g.q >= 4 && ab !== 'regenerator') v *= 0.93 + 0.07 * (p.attrs.STA / 99);
  if (p.loafing) v *= 0.5;
  return v;
}

function blendEff(g, side, p, blend) {
  let v = 0;
  for (const [k, w] of BLENDS[blend]) v += w * eff(g, side, p, k);
  return Math.max(1, v);
}

// Edge of player a over player b in a named matchup (duels.js). 0 is an ordinary matchup;
// +0.1 means a is about 10% better than usual. Both players' type matchups count.
function duel(g, aSide, a, b, type) {
  const d = DUELS[type];
  const fa = typeFactor(a.types, a.ability, b.types, b.ability);
  const fb = typeFactor(b.types, b.ability, a.types, a.ability);
  let A = blendEff(g, aSide, a, d.a) * typeMod(fa);
  let B = blendEff(g, 1 - aSide, b, d.b) * typeMod(fb);
  if (b.ability === 'intimidate' && !INTIMIDATE_IMMUNE.has(a.ability)) A *= 0.94;
  if (a.ability === 'intimidate' && !INTIMIDATE_IMMUNE.has(b.ability)) B *= 0.94;
  if (a.ability === 'wonder-guard' && fb < 2) B *= 0.55;
  if (b.ability === 'wonder-guard' && fa < 2) A *= 0.55;
  // Damped and soft-capped at ±0.4, so a level-100 star against a level-50 rookie wins big but not absurdly.
  const edge = 0.4 * Math.tanh((0.8 * Math.log(A / B) - DUEL_REF[type]) / 0.4);
  return { edge, fa, fb };
}

// Tuning knobs: base rates give NFL-like averages when every edge is 0.
const TUNE = {
  runBase: 1.6, runLine: 5, breakScale: 3, breakBase: -1.4, powerScale: 2, awayScale: 3.5, awayBase: -1.6,
  pressScale: 3.5, pressBase: -1.25, sackScale: 2.2, sackBase: -1.15, sepScale: 2.5, throwScale: 1.8, catchScale: 1.0,
  comp: { short: 1.15, medium: 0.3, deep: -0.55 },
  int: { short: -4.2, medium: -3.5, deep: -2.9 },
  yac: { short: 2.3, medium: 2.0, deep: 2.4 }, yacScale: 3.5,
  yacBreakScale: 3, yacBreakBase: -2.9,
};

function typeCallout(factor, target, other) {
  if (factor === 0) return ` It doesn't affect ${target.name}...`;
  if (factor >= 2) return " It's super effective!";
  if (factor <= 0.5) return ` ${other.name}'s tackle is not very effective...`;
  return '';
}

// ---------- drives, clock, scoring ----------
function startDrive(g) {
  g.drive = { team: g.poss, q: g.q, clock: g.clock, startYl: g.yl, plays: 0, yards: 0, top: 0, result: null, endYl: g.yl, points: 0 };
}
function endDrive(g, result, points = 0) {
  if (!g.drive) return;
  g.drive.result = result;
  g.drive.points = points;
  g.drive.endYl = clamp(g.yl, 0, 100);
  g.drives.push(g.drive);
  g.drive = null;
}

function useClock(g, secs) {
  const s = Math.min(secs, g.clock);
  g.clock -= s;
  g.team[g.poss].top += s;
  if (g.drive) g.drive.top += s;
}

function addPoints(g, side, pts) {
  g.score[side] += pts;
  const qi = Math.min(g.q, 5) - 1;
  for (const arr of g.byQuarter) while (arr.length <= qi) arr.push(0);
  g.byQuarter[side][qi] += pts;
}

function changePossession(g, newYl) {
  g.poss = 1 - g.poss;
  g.yl = clamp(newYl, 1, 99);
  g.down = 1;
  g.dist = Math.min(10, 100 - g.yl);
  startDrive(g);
}

function endQuarter(g) {
  if (g.q === 1 || g.q === 3) {
    note(g, `End of quarter ${g.q}. ${scoreline(g)}`);
    g.q += 1;
    g.clock = QUARTER;
    return;
  }
  if (g.q === 2) {
    note(g, `Halftime. ${scoreline(g)}`);
    if (g.drive) endDrive(g, 'End of half');
    g.q = 3;
    g.clock = QUARTER;
    g.kickoffBy = 1 - g.openingKicker;
    g.freeKick = false;
    return;
  }
  // End of regulation or of an overtime period.
  if (g.drive) endDrive(g, g.score[0] === g.score[1] ? 'End of period' : 'End of game');
  if (g.score[0] !== g.score[1] || (g.allowTie && g.q >= 5)) {
    g.over = true;
    note(g, `Final${g.q >= 5 ? ' (OT)' : ''}. ${scoreline(g)}`);
    return;
  }
  g.q += 1;
  g.ot = true;
  g.clock = OT_LENGTH;
  const kicker = g.rng.chance(0.5) ? 0 : 1;
  g.kickoffBy = kicker;
  g.freeKick = false;
  note(g, `Overtime. Sudden death. ${g.teams[1 - kicker].name} will receive.`);
}

function scoreline(g) {
  return `${g.teams[0].abbr} ${g.score[0]}, ${g.teams[1].abbr} ${g.score[1]}.`;
}

function suddenDeath(g) {
  if (g.q >= 5 && g.score[0] !== g.score[1]) {
    if (g.drive) endDrive(g, 'Game over');
    g.over = true;
    note(g, `Final (OT). ${scoreline(g)}`);
    return true;
  }
  return false;
}

function touchdown(g, side, text, entryExtra = {}) {
  addPoints(g, side, 6);
  logPlay(g, { ...entryExtra, text: `${text} TOUCHDOWN ${g.teams[side].name}.`, scoring: 'TD', score: [...g.score] });
  if (g.drive) endDrive(g, g.drive.team === side ? 'Touchdown' : entryExtra.turnover ?? 'Turnover', 6);
  if (suddenDeath(g)) return;
  g.pendingPAT = side;
}

function afterTouchdown(g) {
  const side = g.pendingPAT;
  g.pendingPAT = null;
  g.snapClock = g.clock;
  const t = g.teams[side];
  const k = t.on.K;
  const diff = diffFor(g, side);
  const late = g.q >= 4 && gameSecondsLeft(g) < 600;
  const goForTwo = late && [-2, -5, -10, 1, 5, -9].includes(diff);
  if (goForTwo) {
    const o = t.on;
    const d = g.teams[1 - side].on;
    const offPower = (eff(g, side, o.QB, 'THA') + eff(g, side, o.RB, 'STR') + eff(g, side, o.WR1, 'CTH')) / 3;
    const defPower = (eff(g, 1 - side, d.MLB, 'TAK') + eff(g, 1 - side, d.CB1, 'COV') + eff(g, 1 - side, d.FS, 'COV')) / 3;
    const ok = g.rng.chance(logistic((offPower - defPower) / 20 - 0.1));
    if (ok) addPoints(g, side, 2);
    logPlay(g, { kind: 'pat', text: `Two-point try is ${ok ? 'GOOD' : 'no good'}.`, scoring: ok ? '2PT' : null, poss: side, score: [...g.score] });
  } else {
    const kl = line(g, k, side);
    kl.kick.xpa++;
    const ok = g.rng.chance(fgProbability(g, side, k, 33) * 0.985);
    if (ok) { kl.kick.xpm++; addPoints(g, side, 1); }
    logPlay(g, { kind: 'pat', text: `${k.name} extra point is ${ok ? 'good' : 'NO GOOD'}.`, scoring: ok ? 'XP' : null, poss: side, score: [...g.score] });
  }
  g.kickoffBy = side;
  g.freeKick = false;
}

function fgProbability(g, side, k, dist) {
  const power = eff(g, side, k, 'KPW');
  const acc = eff(g, side, k, 'KAC');
  const range = 30 + 0.3 * power;
  let x = (range - dist) / 5.5 + (acc - 60) / 35 + 0.5;
  if (g.weather === 'rain' || g.weather === 'snow') x -= 0.35;
  if (g.weather === 'sand') x -= 0.2;
  return logistic(x);
}

// ---------- kickoffs and punts ----------
function returner(t) {
  const options = [t.on.RB, t.on.WR3, t.on.CB2];
  return options.reduce((a, b) => (b.attrs.SPD > a.attrs.SPD ? b : a));
}

function kickoff(g) {
  g.snapClock = g.clock;
  const kSide = g.kickoffBy;
  const rSide = 1 - kSide;
  g.kickoffBy = null;
  const kt = g.teams[kSide];
  const rt = g.teams[rSide];
  const k = kt.on.K;
  const freeKick = g.freeKick;
  g.freeKick = false;
  g.poss = rSide;

  const trailing = diffFor(g, kSide);
  const onside = !freeKick && g.q >= 4 && trailing < 0 && trailing >= -16 && gameSecondsLeft(g) < 150;
  if (onside) {
    const kept = g.rng.chance(0.12);
    useClock(g, 4);
    if (kept) {
      g.poss = kSide;
      g.yl = 47; g.down = 1; g.dist = 10;
      startDrive(g);
      logPlay(g, { kind: 'kickoff', text: `${k.name} onside kick... RECOVERED by ${kt.name}!`, yl: 47 });
    } else {
      g.yl = 53; g.down = 1; g.dist = 10;
      startDrive(g);
      logPlay(g, { kind: 'kickoff', text: `${k.name} onside kick is recovered by ${rt.name} at the ${spot(g, 53)}.`, yl: 53 });
    }
    return;
  }

  const power = eff(g, kSide, k, 'KPW');
  const touchback = !freeKick && g.rng.chance(logistic((power - 55) / 12));
  if (touchback) {
    g.yl = 30; g.down = 1; g.dist = 10;
    startDrive(g);
    logPlay(g, { kind: 'kickoff', text: `${k.name} kicks off into the end zone. Touchback.`, yl: 30 });
    return;
  }
  const r = returner(rt);
  const retEdge = duel(g, rSide, r, g.rng.pick([kt.on.WLB, kt.on.SLB, kt.on.SS]), 'returns').edge;
  const start = freeKick ? 18 : 0;
  let yds = Math.round(23 + 25 * retEdge + g.rng.normal(0, 6));
  if (g.rng.chance(logistic(6 * retEdge - 4.3))) yds = 100;
  const yl = clamp(start + yds, 5, 100);
  const rl = line(g, r, rSide);
  rl.ret.n++; rl.ret.yds += Math.min(yds, 100 - start);
  useClock(g, 6);
  if (yl >= 100) {
    rl.ret.td++;
    g.yl = 100;
    startDrive(g);
    touchdown(g, rSide, `${freeKick ? 'Free kick' : 'Kickoff'} returned by ${r.name} ALL THE WAY!`, { kind: 'kickoff', yards: 100 });
    return;
  }
  g.yl = yl; g.down = 1; g.dist = 10;
  startDrive(g);
  logPlay(g, { kind: 'kickoff', text: `${k.name} ${freeKick ? 'free kick' : 'kicks off'}. ${r.name} returns it ${yds} yards to the ${spot(g, yl)}.`, yl });
}

function punt(g) {
  const side = g.poss;
  const t = off(g);
  const rt = def(g);
  const p = t.on.P;
  const pl = line(g, p, side);
  const startYl = g.yl;
  const gross = Math.round(clamp(40 + (eff(g, side, p, 'KPW') - 60) * 0.15 + g.rng.normal(0, 5.5) - (g.weather === 'rain' ? 2 : 0), 20, 70));
  const land = startYl + gross;
  pl.punt.n++;
  useClock(g, 8);
  if (land >= 100) {
    pl.punt.yds += 100 - startYl;
    logPlay(g, { kind: 'punt', text: `${p.name} punts ${100 - startYl} yards into the end zone. Touchback.`, yards: 0 });
    endDrive(g, 'Punt');
    changePossession(g, 20);
    return;
  }
  pl.punt.yds += gross;
  pl.punt.lng = Math.max(pl.punt.lng, gross);
  const r = returner(rt);
  let ret = 0;
  let text = `${p.name} punts ${gross} yards`;
  if (land > 90 || g.rng.chance(0.45)) {
    text += `. Fair catch by ${r.name}.`;
  } else {
    ret = Math.max(0, Math.round(g.rng.normal(8, 6)));
    if (g.rng.chance(logistic(6 * duel(g, 1 - side, r, t.on.SS, 'returns').edge - 4))) ret = 100;
    const rl = line(g, r, 1 - side);
    rl.ret.n++;
    if (land - ret <= 0) {
      rl.ret.yds += land; rl.ret.td++;
      endDrive(g, 'Punt');
      g.poss = 1 - side; g.yl = 100;
      startDrive(g);
      touchdown(g, 1 - side, `${text}. ${r.name} takes it back for a score!`, { kind: 'punt' });
      return;
    }
    rl.ret.yds += ret;
    text += `. ${r.name} returns it ${ret} yards.`;
  }
  logPlay(g, { kind: 'punt', text, yards: 0 });
  endDrive(g, 'Punt');
  changePossession(g, 100 - (land - ret));
}

function fieldGoal(g) {
  const side = g.poss;
  const k = off(g).on.K;
  const kl = line(g, k, side);
  const dist = 100 - g.yl + 17;
  kl.kick.fga++;
  const ok = g.rng.chance(fgProbability(g, side, k, dist));
  useClock(g, 5);
  if (ok) {
    kl.kick.fgm++;
    kl.kick.lng = Math.max(kl.kick.lng, dist);
    addPoints(g, side, 3);
    logPlay(g, { kind: 'fg', text: `${k.name} ${dist}-yard field goal is GOOD.`, scoring: 'FG', score: [...g.score] });
    endDrive(g, 'Field goal', 3);
    if (suddenDeath(g)) return;
    g.kickoffBy = side;
  } else {
    logPlay(g, { kind: 'fg', text: `${k.name} ${dist}-yard field goal is NO GOOD.` });
    endDrive(g, 'Missed FG');
    changePossession(g, Math.max(20, 107 - g.yl));
  }
}

// ---------- play calling ----------
function hurry(g) {
  const diff = diffFor(g, g.poss);
  return (g.q === 2 && g.clock <= 120) || (g.q === 4 && g.clock <= 300 && diff < 0) || (g.q >= 5 && g.clock <= 120);
}

function callPlay(g) {
  const t = off(g);
  const diff = diffFor(g, g.poss);
  const left = gameSecondsLeft(g);
  const fgDist = 117 - g.yl;
  const kickP = fgProbability(g, g.poss, t.on.K, fgDist);

  if (g.q === 4 && diff > 0 && left <= 40 * (5 - g.down)) return 'kneel';
  if (g.q === 2 && g.clock <= 30 && g.yl < 45) return 'kneel';
  if ((g.q === 2 || (g.q === 4 && diff >= -3 && diff <= 0) || g.q >= 5) && g.clock <= 8 && kickP > 0.25) return 'fg';
  if (g.q >= 5 && g.down >= 3 && kickP > 0.8) return 'fg';

  if (g.down === 4) {
    const desperate = g.q >= 4 && diff < 0 && (left < 240 || (diff < -8 && left < 480));
    if (desperate && !(diff >= -3 && kickP > 0.6 && left < 30)) return pickOffense(g, true);
    const aggr = t.strategy.aggression;
    if (g.dist <= 1 && g.yl >= 40 && g.rng.chance(0.25 + 0.5 * aggr)) return pickOffense(g, true);
    if (g.dist <= 3 && g.yl >= 55 && kickP < 0.55 && g.rng.chance(0.3 + 0.5 * aggr)) return pickOffense(g, true);
    if (kickP >= 0.45 && g.yl >= 55) return 'fg';
    if (g.yl >= 63 && g.dist <= 6) return pickOffense(g, true);
    if (g.yl >= 65) return 'fg';
    return 'punt';
  }
  return pickOffense(g, false);
}

function pickOffense(g, fourth) {
  const t = off(g);
  const diff = diffFor(g, g.poss);
  const left = gameSecondsLeft(g);
  const o = t.on;
  let runP;
  if (g.down === 1) runP = 0.5;
  else if (g.down === 2) runP = g.dist <= 3 ? 0.6 : g.dist >= 8 ? 0.35 : 0.46;
  else runP = g.dist <= 1 ? 0.62 : g.dist <= 3 ? 0.4 : g.dist <= 5 ? 0.2 : 0.07;
  if (fourth) runP = g.dist <= 1 ? 0.65 : 0.2;
  if (g.q >= 4 && left < 420 && diff < 0) runP *= 0.45;
  if (g.q >= 4 && diff > 0) runP = Math.min(0.88, runP * 1.5);
  if (hurry(g)) runP *= 0.5;
  // Teams lean on what they do well.
  const runGame = (o.RB.ovr.RB + (o.LG.attrs.RBK + o.C.attrs.RBK + o.RG.attrs.RBK) / 3) / 2;
  const passGame = (o.QB.ovr.QB * 1.5 + (o.WR1.ovr.WR + o.WR2.ovr.WR) / 2) / 2.5;
  runP += clamp((runGame - passGame) / 120, -0.1, 0.1) + 0.12 * t.strategy.runBias;
  runP = clamp(runP, 0.03, 0.92);
  if (g.rng.chance(runP)) return 'run';
  let deep = 0.14, medium = 0.3;
  if (g.down === 3 && g.dist > 8) { deep = 0.2; medium = 0.45; }
  if (g.dist <= 3) { deep = 0.08; medium = 0.18; }
  if (g.q >= 4 && left < 300 && diff < -8) deep += 0.12;
  deep += clamp((o.QB.attrs.THP - 65) / 300, -0.05, 0.08);
  if (100 - g.yl < 20) { deep = 0; medium = 0.35; }
  const r = g.rng.next();
  return r < deep ? 'deep' : r < deep + medium ? 'medium' : 'short';
}

function penaltyRate(t) {
  let awr = 0;
  for (const s of SLOTS) awr += t.on[s.id].attrs.AWR;
  return clamp(1.6 - awr / SLOTS.length / 80, 0.6, 1.6);
}

// ---------- the snap ----------
function scrimmage(g) {
  if (!g.drive) startDrive(g);
  g.snapClock = g.clock;
  const call = callPlay(g);
  if (call === 'punt') return punt(g);
  if (call === 'fg') return fieldGoal(g);

  // Truant players loaf on every other snap.
  for (const t of g.teams) for (const s of SLOTS) {
    const p = t.on[s.id];
    if (p.ability === 'truant') { p.truantTick ^= 1; p.loafing = p.truantTick === 1; } else p.loafing = false;
  }

  if (call === 'kneel') {
    useClock(g, 40);
    g.team[g.poss].plays++;
    if (g.down === 4 && g.clock <= 0) {
      if (g.drive) g.drive.plays++;
      logPlay(g, { kind: 'kneel', yards: 0, startYl: g.yl, text: `${off(g).on.QB.name} takes a knee as time runs out.` });
      endDrive(g, 'End of game');
      return;
    }
    advance(g, g.yl > 1 ? -1 : 0, `${off(g).on.QB.name} takes a knee.`, { kind: 'kneel' });
    return;
  }

  // Pre-snap penalties.
  const oRate = penaltyRate(off(g));
  const dRate = penaltyRate(def(g));
  if (g.rng.chance(0.022 * oRate)) return penalty(g, 'O', 'False start', 5, true, 0);
  if (g.rng.chance(0.018 * dRate)) return penalty(g, 'D', 'Offside', 5, false, 0);

  if (call === 'run') runPlay(g);
  else passPlay(g, call);
}

function penalty(g, who, name, yards, offense, clockSecs) {
  const side = offense ? g.poss : 1 - g.poss;
  const t = g.teams[side];
  g.team[side].penalties++;
  useClock(g, clockSecs);
  if (offense) {
    const y = Math.min(yards, Math.floor(g.yl / 2));
    g.team[side].penYds += y;
    logPlay(g, { kind: 'penalty', text: `PENALTY on ${t.name}: ${name}, ${y} yards.`, yards: -y, startYl: g.yl });
    g.yl -= y;
    g.dist += y;
  } else {
    const y = Math.min(yards, Math.floor((100 - g.yl) / 2));
    g.team[side].penYds += y;
    const firstDown = g.dist - y <= 0;
    logPlay(g, { kind: 'penalty', text: `PENALTY on ${t.name}: ${name}, ${y} yards.${firstDown ? ' First down.' : ''}`, yards: y, startYl: g.yl });
    g.yl += y;
    g.dist -= y;
    if (firstDown) { g.down = 1; g.dist = Math.min(10, 100 - g.yl); g.team[g.poss].firstDowns++; }
  }
}

// Move the ball after a play from scrimmage and settle downs, scores and turnovers.
function advance(g, yards, text, extra = {}) {
  const side = g.poss;
  const startYl = g.yl;
  const newYl = startYl + yards;
  if (g.drive) { g.drive.plays++; g.drive.yards += yards; }
  if (newYl >= 100) {
    g.yl = 100;
    touchdown(g, side, text, { yards: 100 - startYl, startYl, yl: startYl, ...extra });
    return;
  }
  if (newYl <= 0) {
    addPoints(g, 1 - side, 2);
    g.yl = 0;
    logPlay(g, { ...extra, yards, startYl, text: `${text} SAFETY.`, scoring: 'SAFETY', score: [...g.score] });
    endDrive(g, 'Safety');
    if (suddenDeath(g)) return;
    g.kickoffBy = side;
    g.freeKick = true;
    return;
  }
  const wasDown = g.down;
  const wasDist = g.dist;
  g.yl = newYl;
  if (wasDown === 3) g.team[side].thirdAtt++;
  if (wasDown === 4) g.team[side].fourthAtt++;
  if (yards >= wasDist) {
    g.down = 1;
    g.dist = Math.min(10, 100 - newYl);
    g.team[side].firstDowns++;
    if (wasDown === 3) g.team[side].thirdConv++;
    if (wasDown === 4) g.team[side].fourthConv++;
    logPlay(g, { ...extra, yards, startYl, down: wasDown, dist: wasDist, yl: startYl, text, first: true });
    return;
  }
  if (wasDown === 4) {
    logPlay(g, { ...extra, yards, startYl, down: wasDown, dist: wasDist, yl: startYl, text: `${text} Turnover on downs.` });
    endDrive(g, 'Downs');
    changePossession(g, 100 - newYl);
    return;
  }
  g.down = wasDown + 1;
  g.dist = wasDist - yards;
  logPlay(g, { ...extra, yards, startYl, down: wasDown, dist: wasDist, yl: startYl, text });
}

function fumble(g, carrier, tackler, yards, text, extra) {
  const side = g.poss;
  line(g, carrier, side).rush.fum++;
  line(g, tackler, 1 - side).def.ff++;
  const lost = g.rng.chance(0.52);
  if (!lost) return advance(g, yards, `${text} ${carrier.name} FUMBLES but recovers.`, extra);
  const spotYl = clamp(g.yl + yards, 1, 99);
  g.team[side].turnovers++;
  if (g.drive) { g.drive.plays++; g.drive.yards += yards; }
  logPlay(g, { ...extra, yards, startYl: g.yl, text: `${text} FUMBLE forced by ${tackler.name}, recovered by ${def(g).name}.`, turnover: true });
  g.yl = spotYl;
  endDrive(g, 'Fumble');
  changePossession(g, 100 - spotYl);
}

function runPlay(g) {
  const side = g.poss;
  const o = off(g).on;
  const d = def(g).on;
  const rng = g.rng;
  const rb = o.RB;
  const outside = rng.chance(0.42);
  const left = rng.chance(0.5);
  const blockers = outside ? [left ? o.LT : o.RT, o.TE] : [o.LG, o.C, o.RG];
  const front = outside ? [left ? d.RE : d.LE, left ? d.SLB : d.WLB] : [d.DT1, d.DT2, d.MLB];

  let edge = 0;
  front.forEach((dp, i) => { edge += duel(g, side, blockers[i % blockers.length], dp, 'runBlock').edge; });
  edge /= front.length;

  let yards = Math.max(-7, rng.normal(TUNE.runBase + TUNE.runLine * edge, 2.1));
  const tackler1 = rng.chance(0.72) ? rng.weighted(front, (p) => eff(g, 1 - side, p, 'TAK')) : rng.pick([d.WLB, d.SLB, d.SS, d.FS]);
  const e1 = duel(g, side, rb, tackler1, 'elude');
  let breakX = TUNE.breakScale * e1.edge + TUNE.breakBase;
  if (rb.ability === 'multiscale' || rb.ability === 'shadow-shield') breakX += 0.35;
  const broke = rng.chance(logistic(breakX));
  let tackler = tackler1;
  let callout = '';
  let longRun = false;
  if (!broke) {
    yards += Math.max(-1, rng.normal(0.9 + TUNE.powerScale * duel(g, side, rb, tackler1, 'power').edge, 1.1));
